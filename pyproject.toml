[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosphere-audio"
version = "0.1.0"
description = "Comprehensive audio processing and routing system for immersive experiences"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Atmosphere Team", email = "atmosphere@example.com"},
]
maintainers = [
    {name = "Atmosphere Team", email = "atmosphere@example.com"},
]
keywords = [
    "audio",
    "processing",
    "spatial",
    "effects",
    "reverb",
    "delay",
    "routing",
    "network",
    "acoustic",
    "dsp",
    "music",
    "sound",
    "3d-audio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "fastapi>=0.68.0,<1.0.0",
    "uvicorn[standard]>=0.15.0,<1.0.0",
    "pydantic>=1.8.0,<3.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
    "scipy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/caraxesthebloodwyrm02/Atmosphere"
Repository = "https://github.com/caraxesthebloodwyrm02/Atmosphere"
Issues = "https://github.com/caraxesthebloodwyrm02/Atmosphere/issues"
Documentation = "https://github.com/caraxesthebloodwyrm02/Atmosphere#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=10.0.0",
    "black>=22.0.0,<24.0.0",
    "isort>=5.0,<6.0",
    "mypy>=1.0.0,<2.0",
    "flake8>=5.0.0,<7.0",
    "pre-commit>=2.0.0,<4.0",
    "types-networkx",
    "scipy-stubs",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-rerunfailures>=10.0.0",
]

[tool.black]
line-length = 79
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = false
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "echoes.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 79
extend-ignore = ["E203", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".tox",
    ".eggs",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "src/**/__main__.py",
    "src/**/demo.py",
    "src/reverb/spatial_demo.py",
    "src/reverb/demo.py",
    "src/**/examples/*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]