name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install & Test
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev] pytest-cov PyJWT pytest-xdist
        python -m pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=term \
          --cov-branch \
          --cov-fail-under=75 \
          -n auto \
          -v \
          --durations=10
      env:
        TESTING: '1'
        PYTHONPATH: ${{ github.workspace }}
        COVERAGE_FILE: .coverage

    - uses: codecov/codecov-action@v5
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
