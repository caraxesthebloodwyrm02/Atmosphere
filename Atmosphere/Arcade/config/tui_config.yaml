# TUI Configuration
# Configuration for Arcade Terminal TUI

# Theme settings
theme:
  name: "arcade"
  colors:
    primary: "#00ff00"      # Green
    secondary: "#00ffff"    # Cyan
    accent: "#ff00ff"       # Magenta
    success: "#00ff00"
    warning: "#ffff00"
    error: "#ff0000"
    background: "#0a0a0a"
    foreground: "#00ff00"

# Layout preferences
layout:
  sidebar_width: 25
  status_bar_height: 1
  command_input_height: 3
  terminal_output_max_lines: 1000

# Key bindings (can be customized)
key_bindings:
  help: "f1"
  history: "f2"
  tools: "f3"
  back: "escape"
  quit: "ctrl+c"

# History settings
history:
  max_size: 100
  file_path: "~/.arcade_tui_history"

# Auto-completion
completion:
  enabled: true
  show_while_typing: true

# Server connection (optional)
server:
  enabled: false
  host: "localhost"
  port: 7681
  auto_reconnect: true

