name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pytest-cov pytest-xdist mypy types-all

    - name: Validate pipeline setup
      run: |
        echo "Testing pipeline imports..."
        python -c "from pipeline import PipelineConfig, MonetizationPipeline; print('✓ Pipeline imports successful')"
        
        echo "Testing basic pipeline functionality..."
        python -c "
        from pipeline import PipelineConfig, MonetizationPipeline
        config = PipelineConfig()
        pipeline = MonetizationPipeline(config)
        print('✓ Pipeline instantiation successful')
        "
        
        echo "Testing test file exists..."
        if [ -f tests/test_pipeline.py ]; then
            echo "✓ Test file exists"
        else
            echo "✗ Test file missing"
            exit 1
        fi

    - name: Run pipeline tests
      run: |
        echo "Current directory: $(pwd)"
        echo "Python path: $PYTHONPATH"
        echo "Files in directory: $(ls -la)"
        
        python -m pytest tests/test_pipeline.py \
          --cov=pipeline \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-branch \
          --cov-fail-under=75 \
          -v \
          --durations=10 \
          --tb=short

    - name: Run mypy type checking
      run: |
        mypy pipeline.py tests/test_pipeline.py --ignore-missing-imports --no-strict-optional

    - name: Test pipeline execution
      run: |
        echo "Testing pipeline demo execution..."
        python pipeline.py
        echo "✓ Pipeline demo completed successfully"

    - uses: codecov/codecov-action@v5
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        verbose: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy pre-commit

    - name: Run Black
      run: black --check --diff pipeline.py tests/

    - name: Run isort
      run: isort --check-only --diff pipeline.py tests/

    - name: Run flake8
      run: flake8 pipeline.py tests/

    - name: Run mypy
      run: mypy pipeline.py tests/test_pipeline.py --ignore-missing-imports --no-strict-optional
