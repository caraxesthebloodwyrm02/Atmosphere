codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        flags:
          - unittests
        paths:
          - "src"
    patch:
      default:
        target: 80%
        threshold: 1%
        base: auto
        paths:
          - "src"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

flags:
  unittests:
    paths:
      - src/
    carryforward: true

ignore:
  - "tests/"
  - "*/test_*.py"
  - "*/conftest.py"
  - "**/__pycache__/"
  - "**/*.pyc"
