[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosphere-audio"
version = "0.1.0"
description = "Comprehensive audio processing, routing system, and emotionally-adaptive learning companion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8,<4.0"
authors = [
    {name = "Atmosphere Team", email = "atmosphere@example.com"},
]
maintainers = [
    {name = "Atmosphere Team", email = "atmosphere@example.com"},
]
keywords = [
    "audio",
    "processing",
    "spatial",
    "effects",
    "reverb",
    "delay",
    "routing",
    "network",
    "acoustic",
    "dsp",
    "music",
    "sound",
    "3d-audio",
    "learning",
    "adaptive",
    "emotional",
    "ai",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Core scientific computing
    "numpy>=2.0.0,<3.0.0",
    "scipy>=1.12.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "networkx>=3.2,<4.0.0",

    # Web framework & API
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.6,<1.0.0",

    # HTTP client for learning companion
    "httpx>=0.25.0,<1.0.0",

    # Configuration & environment
    "python-dotenv>=1.0.0,<2.0.0",

    # AI/ML integration
    "openai>=1.0.0,<2.0.0",

    # Document processing
    "python-docx>=1.0.0,<2.0.0",

    # System utilities
    "psutil>=5.9.0,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/caraxesthebloodwyrm02/Atmosphere"
Repository = "https://github.com/caraxesthebloodwyrm02/Atmosphere"
Issues = "https://github.com/caraxesthebloodwyrm02/Atmosphere/issues"
Documentation = "https://github.com/caraxesthebloodwyrm02/Atmosphere#readme"

[project.optional-dependencies]
dev = [
    # Testing framework
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "pytest-rerunfailures>=14.0,<15.0",

    # Code quality & linting
    "black>=24.0.0,<25.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.0.0,<2.0.0",
    "flake8>=7.0.0,<8.0.0",
    "pylint>=3.0.0,<4.0.0",

    # Development tools
    "pre-commit>=3.0.0,<4.0.0",

    # Type stubs for better type checking
    "types-networkx>=3.0,<4.0",
]

test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
]

docs = [
    "sphinx>=7.0.0,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "myst-parser>=2.0.0,<3.0.0",
]

# Optional feature sets
audio-processing = [
    "librosa>=0.10.0,<1.0.0",
    "pydub>=0.25.0,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
]

machine-learning = [
    "scikit-learn>=1.3.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.0.0,<5.0.0",
]

database = [
    "psycopg2-binary>=2.9.0,<3.0.0",
    "redis>=4.5.0,<6.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

web-frontend = [
    "jinja2>=3.1.0,<4.0.0",
    "aiofiles>=1.0.0,<3.0.0",
    "python-socketio>=5.0.0,<6.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.pytest_cache
  | htmlcov
  | \.coverage
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = false
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["atmosphere_audio", "src"]
src_paths = ["src", "tests", "atmosphere"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "echoes.*",
    "reverb.*",
    "scipy.*",
    "networkx.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503", "E722", "B905"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".tox",
    ".eggs",
    "htmlcov",
    ".pytest_cache",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
    "*/migrations/*:E501",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --cov=src --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests",
    "atmosphere",
]
python_files = "test_*.py *_test.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async",
    "api: marks tests as API tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src", "atmosphere"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/__main__.py",
    "*/demo.py",
    "*/examples/*.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "except ImportError:",
    "except ModuleNotFoundError:",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["atmosphere_audio", "atmosphere_audio.*"]

[tool.setuptools.package-data]
"atmosphere_audio" = ["py.typed"]

[project.entry-points.console_scripts]
atmosphere = "atmosphere_audio.cli:main"