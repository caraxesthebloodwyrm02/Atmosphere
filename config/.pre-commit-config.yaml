repos:
-   repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
    - id: black
      name: black
      entry: python -m black
      language: system
      types: [python]

-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    - id: isort
      name: isort
      entry: python -m isort
      language: system
      types: [python]

-   repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
    - id: flake8
      name: flake8
      entry: python -m flake8
      language: system
      types: [python]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
    - id: mypy
      name: mypy
      entry: python -m mypy
      language: system
      types: [python]
      args: [--ignore-missing-imports, --no-strict-optional]