# Tool Configuration
# Configuration for interactive tools in Arcade Terminal

tools:
  audio_analyzer:
    name: "Audio Analyzer"
    description: "Analyze audio frequencies, bass, and sound effects"
    commands:
      - "analyze 808-bass"
      - "analyze bass-delay"
      - "analyze sound-effects"
    zone: "audio"
    color: "magenta"
  
  spatial_visualizer:
    name: "Spatial Audio Visualizer"
    description: "3D spatial audio visualization and analysis"
    commands:
      - "visualize 3d"
      - "visualize comprehensive"
    zone: "visual"
    color: "cyan"
  
  interactive_playground:
    name: "Interactive Playground"
    description: "Interactive demos and experiments"
    commands:
      - "playground"
      - "demo audio"
      - "demo spatial"
      - "demo trajectory"
      - "demo preview"
    zone: "games"
    color: "yellow"
  
  game_collection:
    name: "Game Collection"
    description: "Mini-games and entertainment"
    commands:
      - "game list"
      - "game guessing"
      - "game quiz"
      - "game memory"
      - "game challenge"
    zone: "games"
    color: "green"

# Color scheme
colors:
  success: "#00ff00"  # Green
  info: "#00ffff"      # Cyan
  warning: "#ffff00"   # Yellow
  error: "#ff0000"     # Red
  accent: "#ff00ff"    # Magenta
  inactive: "#808080"  # Gray

